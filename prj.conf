# ==============================================================================
# 1. 基础系统配置 (System Configuration)
# ==============================================================================
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_ASSERT=y

# ==============================================================================
# 2. 硬件外设驱动 (Hardware Drivers)
# ==============================================================================
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SPI=y

# ==============================================================================
# 3. 日志与调试终端 (Logging & Debugging - RTT)
# ==============================================================================
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y

# ==============================================================================
# 4. 事件管理器与 CAF 框架 (Event Manager & CAF)
# ==============================================================================
# 这些是实现按键事件扫描和分发的核心，必须开启！
CONFIG_APP_EVENT_MANAGER=y
CONFIG_APP_EVENT_MANAGER_LOG_LEVEL_DBG=y
CONFIG_CAF=y
CONFIG_CAF_BUTTONS=y


# ==============================================================================
# 5. 电源管理模块 (CAF Power Manager)
# ==============================================================================
CONFIG_REBOOT=y
CONFIG_CAF_POWER_MANAGER=y

# [调试专用] 开启后设备会永远保持唤醒，不会进入休眠（会屏蔽下方的 120 秒超时）
# 如果你要测试 120 秒自动休眠，请把下面这行前面的 # 号保留（即注释掉）
CONFIG_CAF_POWER_MANAGER_STAY_ON=y

CONFIG_CAF_POWER_MANAGER_TIMEOUT=120
CONFIG_CAF_POWER_MANAGER_ERROR_TIMEOUT=30
CONFIG_CAF_POWER_MANAGER_CLEAR_RESET_REASON=y

# 开启事件防休眠机制（按键操作会重置休眠定时器，重新计算 120 秒）
CONFIG_CAF_KEEP_ALIVE_EVENTS=y
CONFIG_CAF_BUTTONS_PM_KEEP_ALIVE=y

# ==============================================================================
# 6. ADC 与电池电压检测 (ADC & Battery Voltage)
# ==============================================================================
CONFIG_ADC=y
CONFIG_SENSOR=y
CONFIG_VOLTAGE_DIVIDER=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# ==============================================================================
# 7. USB 设备驱动 (USBD Next Stack + HID)
# ==============================================================================
# 1. 彻底关闭老版本 USB 栈（防止符号冲突）
CONFIG_USB_DEVICE_STACK=n
# 2. 正确开启新版本 USB 设备栈
CONFIG_USB_DEVICE_STACK_NEXT=y
# 3. 开启新版 HID 键盘支持
CONFIG_USBD_HID_SUPPORT=y
# 4. 开启类请求分发器，让 HID 驱动自动应答 SET_IDLE/GET_IDLE
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_HID_SUPPORT=y
# 5. 开启底层协议栈详细调试日志（定位描述符问题用，稳定后可关闭）
CONFIG_USB_DEVICE_LOG_LEVEL_DBG=y
# 修正：新版协议栈的调试日志符号（若不需要可以不加，需要则用下面这行）
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
CONFIG_USBD_HID_LOG_LEVEL_WRN=y
# 6. 增大 USB HID IN 缓冲池（默认2），修复按键高峰期 net_buf 分配失败
CONFIG_USBD_HID_IN_BUF_COUNT=8
# USB Device Stack Next: enlarge UDC buffer pool
# Fix: udc Failed to allocate net_buf 1026/4095 during EP0 control transfers.
CONFIG_UDC_BUF_COUNT=32
CONFIG_UDC_BUF_POOL_SIZE=8192
# ==============================================================================
# 8. Ring Buffer (环形缓冲区 — USB 传输层生产者/消费者桥梁)
# ==============================================================================
CONFIG_RING_BUFFER=y

# ==============================================================================
# 9. BLE HID 传输层 (Bluetooth HID over GATT)
# ==============================================================================
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="NRF Keyboard"
CONFIG_BT_DEVICE_APPEARANCE=961
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_ID_MAX=2
CONFIG_BT_GATT_CLIENT=n
CONFIG_BT_SETTINGS=y
CONFIG_BT_BUF_EVT_RX_COUNT=32
CONFIG_BT_BUF_ACL_TX_COUNT=24
CONFIG_BT_CONN_TX_MAX=24
# 回退连接参数至安全默认值，为主机留出充裕的协商空间（修复 Reason 8 / Reason 22 断连）
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=24
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=40
CONFIG_BT_PERIPHERAL_PREF_LATENCY=4
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
CONFIG_BT_L2CAP_TX_BUF_COUNT=24
CONFIG_BT_ATT_TX_COUNT=24

# BLE pairing stability / debug
CONFIG_BT_GATT_AUTO_SEC_REQ=n
CONFIG_BT_AUTO_PHY_UPDATE=n
CONFIG_BT_SECURITY_ERR_TO_STR=y
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y
CONFIG_BT_HIDS_DEFAULT_PERM_RW_ENCRYPT=y

# ==============================================================================
# 10. Settings 持久化存储 (保存 BLE bonding 与 CCCD)
# ==============================================================================
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# ==============================================================================
# 11. QDEC 正交解码器 (用于 EC11 旋转编码器)
# ==============================================================================
CONFIG_QDEC_NRFX=y

# ==============================================================================
# 12. LVGL 图形库 (LVGL v9.3.0 Graphics Library)
# ==============================================================================
CONFIG_LVGL=y
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_Z_BITS_PER_PIXEL=16
CONFIG_LV_Z_MEM_POOL_SIZE=8192
CONFIG_LV_USE_LABEL=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_Z_RUN_LVGL_ON_WORKQUEUE=y
CONFIG_DISPLAY=y
# LVGL 在 Zephyr 专用工作队列运行 lv_timer_handler，并自动初始化
CONFIG_LV_Z_RUN_LVGL_ON_WORKQUEUE=y
# Zephyr ST7789V display driver 接管硬件初始化
CONFIG_DISPLAY=y
CONFIG_ST7789V=y
CONFIG_ST7789V_RGB565=y

# ==============================================================================
# 13. 模块级日志分级覆写 (Per-Module Log Level Override)
# ==============================================================================
# 全局 CONFIG_LOG_DEFAULT_LEVEL=4 会触发内核 MPU 模块日志洪灾
# (mpu_configure_region / region_allocate_and_init 高频打印)，
# 导致 RTT 后端丢包，冲刷业务模块探测点。
# 以下强制压制 MPU 日志输出，将 RTT 带宽留给 power_mgmt 等业务模块。
CONFIG_MPU_LOG_LEVEL_ERR=y
